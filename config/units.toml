# units.toml - per-TU build manifest.
# unit MUST match the unit column in build/gen/symbol_names.csv.

[build]
compiler = "msvc6.0"
platform = "win32"

# /DNO_STRICT looks like a workaround and is not. VC6's WINDEF.H opens with
# `#ifndef NO_STRICT / #ifndef STRICT / #define STRICT 1`, which VC 4.2's does not
# have at all, and DECLARE_HANDLE keys off it: without STRICT a handle is `typedef
# HANDLE name` (void*), with it a distinct `struct name##__ *`.
#
# That is a MANGLING difference, not a codegen one - both are 32-bit pointers. The
# PoL 2.0 CodeView shows which one retail used: ?hmnuDflt@@3PAXA and
# ?KBChangeMenu@@YIXPAX@Z, where PAX is pointer-to-void. Compiling with STRICT would
# emit PAUHMENU__@@ for every handle-taking function instead.
[flags]
base = ["/nologo", "/c", "/Od", "/MT", "/Gr", "/G5", "/Ob1", "/Gf", "/Gi-", "/GX", "/DNO_STRICT"]
# Twelve TUs keep duplicate string cells in retail (same content, two cells
# inside the unit block): their compile ran without string pooling.
base_nogf = ["/nologo", "/c", "/Od", "/MT", "/Gr", "/G5", "/Ob1", "/Gi-", "/GX", "/DNO_STRICT"]
o2 = ["/nologo", "/c", "/O2", "/MT", "/Gr", "/G5", "/DNO_STRICT"]
o1_frame = ["/nologo", "/c", "/O1", "/Oy-", "/MT", "/Gr", "/G5", "/DNO_STRICT"]
base_oi = ["/nologo", "/c", "/Od", "/MT", "/Gr", "/G5", "/Ob1", "/Oi", "/Gf", "/Gi-", "/GX", "/DNO_STRICT"]
base_gf = ["/nologo", "/c", "/Od", "/MT", "/Gr", "/G5", "/Ob1", "/Gf", "/Gi-", "/GX", "/DNO_STRICT"]
# Buka's modern audio TUs carry C++ exception state (the image's SEH unwind
# funclets come from them); /Gi- pins the incremental-compilation surface off.
base_gx = ["/nologo", "/c", "/Od", "/MT", "/Gr", "/G5", "/Ob1", "/Gf", "/Gi-", "/GX", "/DNO_STRICT"]

[[unit]]
unit = "BASE/AudiereEffects"
source = "src/BASE/AudiereEffects.cpp"
flags = "base_gx"

